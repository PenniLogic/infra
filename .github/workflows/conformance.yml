{
  "name": "Conformance",
  "on": {
    "workflow_dispatch": {},
    "schedule": [
      {
        "cron": "17 5 * * 1"
      }
    ]
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "${{ github.workflow }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "conformance": {
      "name": "Conformance",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 60,
      "steps": [
        {
          "name": "Checkout",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "name": "Python",
          "uses": "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97",
          "with": {
            "python-version": "3.14"
          }
        },
        {
          "name": "Run conformance",
          "run": "mkdir -p conformance-report\nif [ \"$GITHUB_REF\" != \"refs/heads/main\" ] || [ \"$GITHUB_REF_PROTECTED\" != \"true\" ]; then\n  echo \"::error::Conformance requires protected main; no harness was executed.\"\n  touch conformance-report/FAILED\nelse\n  python governance/conformance/run.py --scratch \"$RUNNER_TEMP/conformance-scratch\" --output conformance-report --github-client anonymous --exercise python || touch conformance-report/FAILED\nfi"
        },
        {
          "name": "Upload report",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "conformance-report",
            "path": "conformance-report",
            "retention-days": 3,
            "if-no-files-found": "error"
          }
        },
        {
          "name": "Fail on findings",
          "run": "test ! -f conformance-report/FAILED"
        }
      ]
    }
  }
}
