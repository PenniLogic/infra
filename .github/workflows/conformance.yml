{
  "name": "Conformance",
  "on": {
    "workflow_dispatch": {},
    "schedule": [
      {
        "cron": "17 5 * * 1"
      }
    ]
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "${{ github.workflow }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "conformance": {
      "name": "Conformance",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 60,
      "steps": [
        {
          "name": "Checkout",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "name": "Python",
          "uses": "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97",
          "with": {
            "python-version": "3.14"
          }
        },
        {
          "name": "Node",
          "uses": "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020",
          "with": {
            "node-version-file": ".nvmrc"
          }
        },
        {
          "name": "Install uv",
          "run": "printf 'uv==0.11.33 --hash=sha256:9542178978b0b6f16a7ae99e55aca039f493a1edb373a15d7993eab80a28615a\\n' | python -m pip install --quiet --only-binary :all: --require-hashes --no-deps -r /dev/stdin"
        },
        {
          "name": "Run conformance",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "mkdir -p conformance-report\nif [ \"$GITHUB_REF\" != \"refs/heads/main\" ] || [ \"$GITHUB_REF_PROTECTED\" != \"true\" ]; then\n  echo \"::error::Conformance requires protected main; no harness was executed.\"\n  touch conformance-report/FAILED\nelse\n  python governance/conformance/run.py --scratch \"$RUNNER_TEMP/conformance-scratch\" --output conformance-report --github-client gh --exercise python,node,uv || touch conformance-report/FAILED\nfi"
        },
        {
          "name": "Upload report",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "conformance-report",
            "path": "conformance-report",
            "retention-days": 3,
            "if-no-files-found": "error"
          }
        },
        {
          "name": "Fail on findings",
          "run": "test ! -f conformance-report/FAILED"
        }
      ]
    }
  }
}
